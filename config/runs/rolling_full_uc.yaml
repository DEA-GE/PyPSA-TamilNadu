# Full-year rolling run with binary unit commitment (UC; slowest, most detailed).
# Results go to results/run_results/rolling_2025-04-01_2026-03-31_UC/rolling_full_uc/.
#   python scripts/run_model.py config/runs/rolling_full_uc.yaml
run:
  name: rolling_full_uc
  mode: rolling
  resume: true

formulation:
  unit_commitment: UC

solver:
  mip_rel_gap: 0.01

rolling:
  time_limit: Default             # 1800 s per window attempt for UC
  max_time_limit_mip_gap: 0.10
