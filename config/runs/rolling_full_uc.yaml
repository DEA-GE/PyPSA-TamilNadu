# Full-year rolling run with binary unit commitment (slowest, most detailed).
#   python scripts/run_model.py config/runs/rolling_full_uc.yaml
run:
  name: rolling_full_uc
  mode: rolling
  resume: true

formulation:
  unit_commitment: full

solver:
  mip_rel_gap: 0.01

rolling:
  time_limit: Default             # 1800 s per window attempt for full UC
  max_time_limit_mip_gap: 0.10
