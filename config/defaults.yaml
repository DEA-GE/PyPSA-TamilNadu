# Default settings for scripts/run_model.py.
#
# Every run config in config/runs/ is merged on top of this file, so a run
# config only needs the values that differ from these defaults. Unknown keys
# are rejected so that typos fail before the network is loaded.
#
# Launch a run with:
#   python scripts/run_model.py config/runs/<name>.yaml

run:
  # Output subfolder name: results/run_results/<mode_label>/<name>/.
  # Starts with a letter or number; at most 80 characters of letters, numbers,
  # ".", "_" or "-". Reusing a name resumes or overwrites that run.
  name: null                      # required; set it in the run config
  # daily | monthly | peak | selected_weeks | annual | rolling
  mode: daily
  # YYYY-MM-DD within 2025-04-01..2026-03-31; used by daily and monthly only.
  reference_date: "2025-07-11"
  # rolling / selected_weeks: reuse compatible completed checkpoints.
  resume: true

selected_weeks:                   # used by mode: selected_weeks only
  week_starts:
    - "2025-04-07"                # dry / low hydro
    - "2025-07-07"                # southwest-monsoon wind and hydro peak
    - "2025-10-13"                # monsoon transition
    - "2026-02-16"                # dry-season low renewables
  warmup_days: 1                  # extra solved days before each week; excluded from results
  lookahead_days: 1               # extra solved days after each week; excluded from results
  reservoir_initial_soc_fraction: 0.5   # 0..1 fallback where no observed/proxy level exists
  soc_boundary_tolerance_pu: 0.05

formulation:
  # full: binary on/off (MIP); relaxed: continuous on/off (LP, approximate);
  # none: no on/off decisions or minimum stable output. annual requires none.
  # Result folders are categorised as _UC (full), _relaxed or _LP (none).
  unit_commitment: relaxed

solver:
  name: highs
  threads: Default                # "Default" (8 for full/relaxed, 3 for none) or 1..8
  parallel_workers: Default       # "Default" (2) or a positive integer; independent solves only
  mip_rel_gap: 0.01               # full only; 0.01 = 1 %
  simplex_strategy: null          # annual/rolling only: HiGHS simplex_strategy override
  # annual only: LP algorithm. "Default" = dual simplex; or ipm | simplex.
  # ipm (HiGHS IPX) was far slower on the battery capacity-expansion LP.
  lp_method: Default
  # annual with ipm only: run crossover to a basic solution. false skips it
  # (faster; capacities and dispatch are exact, duals of interior-point accuracy).
  crossover: true

rolling:                          # used by mode: rolling only
  # Seconds per window attempt. "Default" = per mode (none 300, relaxed 700,
  # full 1800); null = unlimited, which disables automatic retries.
  time_limit: Default
  max_time_limit_mip_gap: 0.10    # full only: largest gap accepted at the time limit
  max_windows: null               # debugging: stop after this many windows

paths:                            # relative paths are resolved from the repository root
  network: model
  results_root: results/run_results

logging:
  # Detailed run logging and profiling. When true, the run writes a profile/
  # folder next to its results: run.log, the complete HiGHS log of every solve
  # (profile/highs/), phase timings, solve breakdowns and resource use.
  # Override per run with --profile / --no-profile.
  profile: true
  level: INFO                     # INFO | DEBUG | WARNING | ERROR; DEBUG adds library debug messages to run.log
  sample_interval: 1.0            # seconds between resource samples in profile/resources.csv
  # Copy console output to <results_root>/console_logs/<run name>_<UTC time>.log.
  console_log: true

energy_targets:
  # How the observed FY2025-26 energy of each carrier is imposed:
  #   target       energy equality constraints (daily for oil/gas and nuclear,
  #                month-prorated for bio-power and small hydro)
  #   availability no equality; each dispatchable unit's p_max_pu is scaled per
  #                availability_period so available energy equals observed
  #                energy, and cost optimisation decides how much is used
  #   must_run     as availability, with minimum output equal to availability,
  #                so the plant produces its available energy whatever its cost
  #   energy_cap   oil_gas and bio_power only: no equality; flat availability
  #                (<carrier>_cap_availability) and energy per cap_period capped
  #                at the observed energy (per ICED plant for oil/gas), as in
  #                CEA's planning studies for fuel-limited gas and biomass
  #   free         no equality and the network's own availability
  # Fixed REA export reservations keep their schedules in every mode.
  oil_gas: target
  nuclear: target
  bio_power: target
  small_hydro: target
  availability_period: monthly    # monthly | daily
  # plant: oil/gas and nuclear are scaled plant by plant with each plant's
  # share of NITI ICED monthly generation (idle plants get no availability);
  # carrier: one scaling for all units of a carrier. Bio-power and small hydro
  # are observed only as state totals and are always scaled per carrier.
  availability_source: plant      # plant | carrier
  # energy_cap mode: cap period (annual = FY2025-26, or each month) and flat
  # availability (CEA NEP 2022-32 / LT-NRAP: gas 90%, biomass 60%).
  cap_period: annual              # annual | monthly
  oil_gas_cap_availability: 0.9
  bio_power_cap_availability: 0.6
  # How caps reach solves shorter than their period (rolling windows, days).
  # The annual mode solves whole periods and always enforces caps exactly.
  #   allocation    each plant's daily dispatch in the cap_source annual LP
  #                 becomes its cap (the annual LP allocates the year's fuel);
  #                 kept within 1% of the annual LP in the rolling test
  #   prorate       cap x share of the period's hours solved
  #   shadow_price  experimental: the cap's shadow price from the cap_source
  #                 annual LP is added to marginal cost and positive caps are
  #                 dropped; overshot the bio-power cap 3.6x in the rolling test
  cap_transfer: allocation        # allocation | prorate | shadow_price
  # Results folder (or solved_network.nc) of an annual run with the same caps;
  # used by allocation and shadow_price, relative to the repository root.
  # Produce it with: python scripts/run_model.py config/runs/annual_capped_monthly.yaml
  cap_source: results/run_results/annual_2025-04-01_2026-03-31_LP/annual_capped_monthly

marginal_costs:
  # Marginal-cost overrides in INR/MWh, applied to every unit of the carrier,
  # for sensitivity runs; null keeps the network's official plant costs
  # (data/model_inputs/plant_operating_costs.csv, docs/input-data.md).
  oil_gas: null
  diesel: null
  bio_power: null
  nuclear: null
  small_hydro: null

analysis:
  # Run scripts/build_results_report.py on the finished run.
  enabled: true
  # Compare against observed generation and capacity where available.
  compare_observed: true

technologies:
  # Technologies added to the base network for scenario studies; see
  # config/scenarios/ and the scenario section of README.md. The defaults add
  # nothing, so a run without this section solves the model as it is.
  #
  # Technology parameters (efficiencies, duration, costs, profile file).
  data: config/technologies.yaml
  # Changes to those parameters for this run, e.g. {battery: {max_hours: 2}}.
  parameters: {}
  # Sites per technology: site name -> settings. capacity_mw is either an
  # installed capacity in MW (fixed) or "optimise" to let a capacity-expansion
  # run choose it, optionally within min_mw / max_mw. bus defaults to the site
  # name (a balancing area, e.g. "Tirunelveli"); offshore_wind sites also take
  # profile, a column of the profile file (defaults to the site name).
  battery: {}
  offshore_wind: {}
  # Limits on the total optimised capacity per technology, in MW, e.g.
  # {battery: {min_mw: 1000, max_mw: 3000}}.
  totals: {}
  # CSV of capacities chosen by a capacity-expansion run (written by the
  # Snakemake workflow); they replace "optimise" for an operational run.
  fixed_capacities: null

outages:
  # Coal unit availability (scripts/generator_outages.py): auxiliary
  # consumption, planned maintenance and forced outages of the committable coal
  # units. Off by default, so a run without this section solves the model as
  # it is (static coal p_max_pu 0.85). When on, days before commissioning,
  # commercial unavailability (no fuel supply agreement, no PPA) and units out
  # of service all year are always imposed; reserve shutdowns never are.
  enabled: false
  # Static availability under the outages: net_of_auxiliary (1 - auxiliary
  # consumption; Tamil Nadu demand is ex-bus), gross (1.0) or model (keep the
  # network's p_max_pu).
  base_availability: net_of_auxiliary
  # Partial deratings of running units: demonstrated caps each unit at its
  # best whole day of FY2025-26 without outage, as a share of its rating; none
  # leaves units at their full rating.
  partial_derating: demonstrated
  # Central coal stations (Vallur, NTPL, NNTPS, four NLC stations): declared
  # uses their declared capacity from the SRPC Regional Energy Accounts, hour
  # by hour with planned and forced outages both actual, otherwise as one
  # factor per station; record treats them like the other units.
  central_availability: declared
  # hourly, or monthly / annual: availability averaged per month or year for a
  # less restricted run (a partly available unit acts as a smaller unit, its
  # minimum load scaled likewise).
  resolution: hourly
  # Planned maintenance: actual (FY2025-26 record), optimise (PyPSA's
  # maintenance scheduling chooses the dates for each unit's FY2025-26
  # maintenance duration, in one annual MILP at daily resolution) or none.
  planned: actual
  # Forced outages: actual (FY2025-26 record), sampled (random, from the
  # record's outage rates and durations per unit size class) or none.
  forced: actual
  # Random seed of the sampled forced outages; each unit has its own stream,
  # so every scenario with the same seed gets the same outages.
  seed: 1
  # Outage record, auxiliary consumption and demonstrated capability, from
  # scripts/prepare_coal_outages.py.
  record: data/model_inputs/coal_unit_outages_FY2025_26.csv
  auxiliary: data/model_inputs/coal_auxiliary_consumption.csv
  capability: data/model_inputs/coal_unit_capability_FY2025_26.csv
  # Declared capacity of the central stations and their units, from
  # scripts/prepare_declared_capacity.py.
  declared_capacity: data/model_inputs/central_station_declared_capacity_FY2025_26.csv
  declared_units: data/model_inputs/central_station_units.csv
  # planned: optimise only: CSV of a maintenance schedule written by an earlier
  # run (maintenance_schedule.csv in its folder), used instead of scheduling
  # again. The Snakemake workflow schedules once and shares it.
  maintenance_schedule: null

exchange_trading:
  # Price-responsive power-exchange trading (scripts/exchange_trading.py). Off
  # by default, so a run without this section keeps the fixed interstate
  # schedule. When on, Tamil Nadu's observed exchange trades (DAM, green DAM,
  # high-price DAM, RTM) are taken out of the fixed schedule and the model buys
  # and sells on an IEX market bus at the hourly exchange price; contracted
  # flows (long-term, GNA, T-GNA, REMC) stay fixed. Needs the metered
  # interchange basis (the default build).
  enabled: false
  # headroom: volume limited by the merit-order steps and by the interstate
  # link capacity left by the fixed flows; observed: each hour's imports and
  # exports capped at the observed exchange imports and exports.
  limit: headroom
  # Hourly exchange price (timestamp, price_inr_per_mwh): IEX day-ahead price
  # of Tamil Nadu's bid area.
  price: data/source/iex_dam_fy2025_26/iex_dam_tamil_nadu_hourly_fy2025_26.csv
  # Observed hourly exchange trades from the SRPC REA
  # (scripts/prepare_exchange_trades.py).
  trades: data/model_inputs/tn_exchange_trades_FY2025_26.csv
  # Gateway shares that split the observed trades out of the fixed loads
  # (the build's metered-correction shares).
  gateway_shares: data/model_inputs/rea_interstate_gateway_shares_FY2025_26.csv
  # Per-MWh transmission charge on exchange purchases and sales: TNERC's
  # FY2025-26 short-term open-access charge (Rs 241.81/MW/hour). Contracted
  # flows pay capacity charges, so the interstate links carry no per-MWh
  # charge while trading is on.
  access_charge_inr_per_mwh: 241.81
  # Merit-order steps as [MW, INR/MWh adder], adders not decreasing: imports
  # cost price + adder, exports earn price - adder. Default: one step without
  # adder, i.e. Tamil Nadu trades as a price taker; the size is large enough
  # that, with the headroom limit, the interstate links bind first.
  import_steps: [[30000, 0]]
  export_steps: [[30000, 0]]
