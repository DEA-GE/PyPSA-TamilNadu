# Baseline plus offshore wind: IEA 15 MW turbines in the southernmost
# balancing area (Tirunelveli), with the block 2 capacity factors
# (config/technologies.yaml). The capacity is a scenario choice, not
# optimised by the model.

run:
  name: offshore_wind
  mode: rolling
  resume: true

formulation:
  unit_commitment: relaxed

rolling:
  time_limit: Default
  max_time_limit_mip_gap: 0.10

technologies:
  offshore_wind:
    # Site name -> settings. Offshore wind connects only to Tirunelveli;
    # profile is the column of the profile file (defaults to the site name).
    block2:
      bus: Tirunelveli
      # Installed capacity, a scenario choice (whole 15 MW turbines): one
      # block 2 farm of 68 turbines. Change it to set the scenario.
      capacity_mw: 1020
